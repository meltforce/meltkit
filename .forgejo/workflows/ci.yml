name: CI

on:
  push:
    branches: [main]
    tags:    ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: docker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

      # From the Go module proxy, not GitHub releases — homelab STANDARDS.md
      # § CI / Forgejo Actions, golangci-lint.
      - uses: golangci/golangci-lint-action@v9
        with:
          install-mode: goinstall

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        continue-on-error: true # govulncheck panics on Go 1.25 (x/tools compat issue)
